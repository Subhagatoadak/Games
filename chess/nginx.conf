server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always serve fresh game files during development
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache";
    }
}
